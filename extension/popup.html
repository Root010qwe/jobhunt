<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
 body{font:13px/1.4 -apple-system,system-ui,sans-serif;margin:0;width:300px;color:#17201B;background:#F1F3F0}
 .w{padding:14px;display:grid;gap:10px}
 h1{font-size:15px;margin:0}
 .st{color:#5B675F}
 button{all:unset;cursor:pointer;text-align:center;padding:8px 10px;border-radius:8px;border:1px solid #D8DED9;background:#fff;font-weight:500}
 button.p{background:#2F45C5;color:#fff;border-color:#2F45C5}
 a{color:#2F45C5}
 .app{background:#fff;border:1px solid #D8DED9;border-radius:8px;padding:8px 10px}
</style></head>
<body><div class="w">
 <h1>JobHunt</h1>
 <div class="st" id="st">Проверяю связь с JobHunt…</div>
 <div class="app" id="app" hidden></div>
 <button class="p" id="fill">Заполнить форму на этой странице</button>
 <button id="force">Перезаписать уже заполненные поля</button>
 <button id="mark">Отметить «Подано» в трекере</button>
 <a href="http://localhost:8765" target="_blank">Открыть дашборд</a>
</div><script src="popup.js"></script></body></html>
